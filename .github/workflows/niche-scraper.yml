name: Virdico — Niche Scraper Quotidien

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC = 08:00 Maroc/Paris (hiver)
  workflow_dispatch:      # Lancement manuel depuis GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lancer le scraper
        run: node scraper/scraper-niche-rentable.js

      - name: Déplacer le rapport dans scraper/
        run: mv niche-rentable.html scraper/niche-rentable.html

      - name: Committer le rapport dans le repo
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "Virdico Bot"
          git add scraper/niche-rentable.html
          git diff --cached --quiet || git commit -m "rapport: niche-rentable $(date +'%Y-%m-%d')"
          git push
